{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}<div class="form-container"><h1>Welcome back</h1>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" action="/login"><div class="form-group"><label>Email</label><input type="email" name="email" required></div><div class="form-group"><label>Password</label><input type="password" name="password" required></div><button class="btn" type="submit">Login</button></form><p class="form-note">Don't have an account? <a href="/register">Create one</a>.</p></div>{% endblock %}
