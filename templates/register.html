{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}<div class="form-container"><h1>Create your account</h1>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" action="/register"><div class="form-group"><label>Username</label><input name="username" required></div><div class="form-group"><label>Email</label><input type="email" name="email" required></div><div class="form-group"><label>Password</label><input type="password" name="password" required></div><div class="form-group"><label>Confirm password</label><input type="password" name="confirm_password" required></div><button class="btn" type="submit">Register</button></form></div>{% endblock %}
