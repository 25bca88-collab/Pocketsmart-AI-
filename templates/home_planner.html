{% extends "base.html" %}{% block title %}Home Decor Planner{% endblock %}{% block content %}<div class="form-container"><h1>🏠 Home Decor Planner</h1><p class="lead">Tell PocketSmart AI what you want to create.</p><form method="post" action="/generate-home"><div class="form-group"><label>Budget</label><input name="budget" placeholder="e.g. ₹25,000"></div><div class="form-group"><label>Room</label><input name="room" placeholder="e.g. Living room"></div><div class="form-group"><label>Items needed</label><input name="items" placeholder="e.g. Sofa, curtains, lighting"></div><div class="form-group"><label>Style</label><input name="style" placeholder="e.g. Modern minimalist"></div><div class="form-group"><label>Preferences</label><textarea name="preferences"></textarea></div><div class="form-group"><label>Shopping platforms</label><input name="platforms" placeholder="e.g. Amazon, IKEA, local stores"></div><button class="btn" type="submit">Generate recommendations</button></form></div>{% endblock %}
